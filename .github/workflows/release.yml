name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create release archives
        run: |
          VERSION=${{ github.event.release.tag_name }}
          cd dist
          zip -r ../logbook-${VERSION}.zip .
          tar -czvf ../logbook-${VERSION}.tar.gz .
          cd ..

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            logbook-${{ github.event.release.tag_name }}.zip
            logbook-${{ github.event.release.tag_name }}.tar.gz
