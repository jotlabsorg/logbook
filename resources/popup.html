<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logbook</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-orange: #d29922;
      --accent-purple: #a371f7;
    }
    
    body {
      width: 380px;
      min-height: 200px;
      background: var(--bg-primary);
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
      padding: 16px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
    }
    
    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    
    .status {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      padding: 8px 12px;
      background: var(--bg-secondary);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    
    .status.error {
      border-color: #f85149;
      color: #f85149;
    }
    
    .status.success {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--text-secondary);
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    
    .btn-save .btn-icon {
      background: var(--accent-blue);
    }
    
    .btn-read .btn-icon {
      background: var(--accent-green);
    }
    
    .btn-archive .btn-icon {
      background: var(--accent-orange);
    }
    
    .btn-folder .btn-icon {
      background: var(--accent-purple);
    }
    
    .btn-label {
      flex: 1;
      text-align: left;
    }
    
    .btn-shortcut {
      font-size: 10px;
      color: var(--text-secondary);
      padding: 2px 6px;
      background: var(--bg-tertiary);
      border-radius: 4px;
    }
    
    .setup-container {
      text-align: center;
      padding: 20px 0;
    }
    
    .setup-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="logo">L</div>
      <div class="title">Logbook</div>
    </div>
    <div class="status">Loading...</div>
  </div>
  <script src="js/popup.js"></script>
</body>
</html>
